<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Mohammad Shahroz</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#080808;
            color:white;
            font-family:Poppins,sans-serif;
        }

        .thankyou-box{
            text-align:center;
            padding:40px;
            border:2px solid #00ff51;
            border-radius:20px;
            box-shadow:0 0 25px #00ff51;
        }

        .thankyou-box h1{
            color:#00ff51;
            font-size:4rem;
            margin-bottom:20px;
        }

        .thankyou-box p{
            font-size:2rem;
            margin-bottom:30px;
        }

        .btn{
            display:inline-block;
            padding:12px 30px;
            background:#00ff51;
            color:black;
            border-radius:30px;
            text-decoration:none;
            font-size:1.8rem;
            font-weight:bold;
        }

        .btn:hover{
            box-shadow:0 0 20px #00ff51;
        }
    </style>
</head>
<body>

<div class="thankyou-box">
    <h1>Thank You! 🎉</h1>

    <p>Your message has been sent successfully.</p>

    <a href="index.html" class="btn">Back to Home</a>
</div>

</body>
</html>
